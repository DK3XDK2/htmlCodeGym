<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Thực hành] CSS | grid-template-columns Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>[Thực hành] CSS | grid-template-columns Property</h1>

    <!-- Ví dụ 1: Tạo 3 cột có kích thước bằng nhau -->
    <h3>Ví dụ 1: Tạo 3 cột có kích thước bằng nhau (1fr 1fr 1fr)</h3>
    <div class="grid-container grid-container-1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

    <!-- Ví dụ 2: Tạo các cột có kích thước khác nhau -->
    <h3>Ví dụ 2: Tạo các cột có kích thước khác nhau (100px 200px 1fr)</h3>
    <div class="grid-container grid-container-2">
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
    </div>

</body>
</html>
