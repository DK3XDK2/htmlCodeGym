<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Thực hành] CSS | grid-gap Property</title>
    <link rel="stylesheet" href="gridgap.css">
</head>
<body>

    <h1>[Thực hành] CSS | grid-gap Property</h1>

    <!-- Ví dụ 1: Khoảng cách hàng và cột bằng nhau -->
    <div class="example">
        <h3>Ví dụ 1: Thiết lập khoảng cách giữa hàng và cột bằng nhau (<code>grid-gap: 20px;</code>)</h3>
        <div class="grid-container grid-equal">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>

    <!-- Ví dụ 2: Khoảng cách hàng và cột khác nhau -->
    <div class="example">
        <h3>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau (<code>grid-gap: 30px 10px;</code>)</h3>
        <div class="grid-container grid-different">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </div>

</body>
</html>
