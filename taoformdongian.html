<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sở thích của bạn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h2 {
            background-color: orange;
            color: white;
            padding: 10px;
            width: 400px;
            text-align: center;
        }
        td {
            padding: 5px;
        }
        .label-text {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>SỞ THÍCH CỦA BẠN</h2>
    <form action="#" method="get">
        <table>
            <tr>
                <td class="label-text">Họ và tên</td>
                <td><input type="text" name="yourname"></td>
            </tr>
            <tr>
                <td class="label-text">Email</td>
                <td><input type="text" name="email"></td>
            </tr>
            <tr>
                <td class="label-text">Sở thích</td>
                <td>
                    <input type="checkbox" name="hobby" value="thethao"> Thể thao
                    <input type="checkbox" name="hobby" value="amnhac"> Âm nhạc
                    <input type="checkbox" name="hobby" value="docsach"> Đọc sách <br>
                    <input type="checkbox" name="hobby" value="luotweb"> Lướt web
                    <input type="checkbox" name="hobby" value="choigame"> Chơi game
                    <input type="checkbox" name="hobby" value="dienanh"> Điện ảnh
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Gửi thông tin">
                    <input type="reset" value="Nhập lại">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
