<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo form đơn giản</title>
    <style>
        body {
            font-family: Arial, Tahoma, sans-serif;
            margin: 20px;
        }
        .form-container {
            width: 500px;
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 30px;
        }
        .form-header {
            background-color: #ff6600;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .form-header-blue {
            background-color: #0066cc;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        table {
            width: 100%;
            margin-top: 10px;
        }
        td {
            padding: 6px;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: SỞ THÍCH CỦA BẠN -->
    <div class="form-container">
        <div class="form-header">SỞ THÍCH CỦA BẠN</div>
        <form action="#" method="POST">
            <table>
                <tr>
                    <td style="color: blue; font-weight: bold; width: 120px;">Họ và tên</td>
                    <td><input type="text" name="yourname" size="30"></td>
                </tr>
                <tr>
                    <td style="color: blue; font-weight: bold;">Email</td>
                    <td><input type="text" name="email" size="30"></td>
                </tr>
                <tr>
                    <td style="color: blue; font-weight: bold; vertical-align: top;">Sở thích</td>
                    <td style="color: orange;">
                        <input type="checkbox" name="hobby" value="thethao"> Thể thao
                        <input type="checkbox" name="hobby" value="amnhac"> Âm nhạc
                        <input type="checkbox" name="hobby" value="docsach"> Đọc sách <br>
                        <input type="checkbox" name="hobby" value="luotweb"> Lướt web
                        <input type="checkbox" name="hobby" value="choigame"> Chơi game
                        <input type="checkbox" name="hobby" value="dienanh"> Điện ảnh <br>
                        <input type="checkbox" name="hobby" value="dulich"> Du lịch
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Gửi thông tin">
                        <input type="reset" value="Nhập lại">
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <!-- PHẦN 2: ĐĂNG KÝ HỌC VIÊN -->
    <div class="form-container">
        <div class="form-header-blue">ĐĂNG KÝ HỌC VIÊN</div>
        <form action="#" method="POST">
            <table>
                <tr>
                    <td style="width: 120px;">Họ và tên</td>
                    <td><input type="text" name="name" size="30"></td>
                </tr>
                <tr>
                    <td>Ngày sinh</td>
                    <td><input type="text" name="dob" size="15" placeholder="dd/mm/yyyy"></td>
                </tr>
                <tr>
                    <td>Giới tính</td>
                    <td>
                        <input type="radio" name="gender" value="male"> Nam
                        <input type="radio" name="gender" value="female"> Nữ
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: top;">Địa chỉ</td>
                    <td><textarea name="address" rows="3" cols="32"></textarea></td>
                </tr>
                <tr>
                    <td>Lớp</td>
                    <td>
                        <select name="class">
                            <option value="">-- Chọn lớp --</option>
                            <option value="10">Lớp 10</option>
                            <option value="11">Lớp 11</option>
                            <option value="12">Lớp 12</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input type="text" name="email" size="30"></td>
                </tr>
                <tr>
                    <td>Điện thoại</td>
                    <td><input type="text" name="phone" size="20"></td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Đăng ký">
                        <input type="reset" value="Nhập lại">
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
