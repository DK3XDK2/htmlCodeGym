<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Thực hành] CSS | flex-flow Property</title>
    <link rel="stylesheet" href="flexflow.css">
</head>
<body>

    <h1>[Thực hành] CSS | flex-flow Property</h1>

    <!-- Ví dụ 1: row nowrap -->
    <div class="example">
        <h3>1. <code>flex-flow: row nowrap;</code> (Mặc định: trái sang phải, không xuống dòng)</h3>
        <div class="container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>

    <!-- Ví dụ 2: row-reverse nowrap -->
    <div class="example">
        <h3>2. <code>flex-flow: row-reverse nowrap;</code> (Đảo ngược: phải sang trái, không xuống dòng)</h3>
        <div class="container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>

    <!-- Mở rộng: row wrap -->
    <div class="example">
        <h3>3. Mở rộng: <code>flex-flow: row wrap;</code> (Hàng ngang, tự động xuống dòng)</h3>
        <div class="container-3">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>
    </div>

</body>
</html>
