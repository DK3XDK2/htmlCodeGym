<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Bài tập] Tái cấu trúc mã CSS cho sẵn</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Lớp layout nổi phía trước đã được tái cấu trúc loại bỏ toàn bộ inline styles -->
    <div class="layout-overlay">
        <div class="gridcontainer">
            <!-- Header (tím) -->
            <div class="gridwrapper header-wrapper">
                <div class="gridcontent col-12 header-content"></div>
            </div>

            <!-- Thân trang: Sidebar trái (3 cột = 25%), khoảng trống giữa (6 cột), Nội dung phải (3 cột = 25%) -->
            <div class="gridwrapper body-wrapper">
                <!-- Cột trái: 4 mục menu -->
                <div class="gridcontent col-3 sidebar-col">
                    <div class="menu-item"></div>
                    <div class="menu-item"></div>
                    <div class="menu-item"></div>
                    <div class="menu-item"></div>
                </div>

                <!-- 6 cột trống ở giữa -->
                <div class="gridcontent col-1 blank-col"></div>
                <div class="gridcontent col-1 blank-col"></div>
                <div class="gridcontent col-1 blank-col"></div>
                <div class="gridcontent col-1 blank-col"></div>
                <div class="gridcontent col-1 blank-col"></div>
                <div class="gridcontent col-1 blank-col"></div>

                <!-- Cột phải: Khối nội dung lớn -->
                <div class="gridcontent col-3 main-col">
                    <div class="main-box"></div>
                </div>
            </div>

            <!-- Footer (xanh dương) -->
            <div class="gridwrapper footer-wrapper">
                <div class="gridcontent col-12 footer-content"></div>
            </div>
        </div>
    </div>

    <!-- Khung lưới nền 12 cột làm thước đo chuẩn phía dưới -->
    <div class="gridcontainer grid-background">
        <div class="gridwrapper grid-wrapper-bg">
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
            <div class="gridcontent col-1"></div>
        </div>
    </div>

    <p class="notice-text">
        Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space. Mã nguồn CSS đã được tái cấu trúc hoàn toàn bằng SASS (biến, mixins, vòng lặp tạo hệ thống 12 cột responsive và nesting).
    </p>

</body>
</html>
