<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Danh sach trong CSS</title>
    <style>
        ul.circle {
            list-style-type: circle;
        }
        ul.square {
            list-style-type: square;
        }

        ol.roman {
            list-style-type: upper-roman;
        }
        ol.alpha {
            list-style-type: lower-alpha;
        }

        ol.colored {
            background: #ff9999;
            padding: 20px;
        }
        ol.colored li {
            background: #ffe5e5;
            padding: 5px;
            margin-left: 35px;
        }
    </style>
</head>
<body>

    <h2>Danh sach khong thu tu (ul)</h2>
    <ul class="circle">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>

    <ul class="square">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>

    <h2>Danh sach co thu tu (ol)</h2>
    <ol class="roman">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ol>

    <ol class="alpha">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ol>

    <h2>Danh sach co mau sac</h2>
    <ol class="colored">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ol>

</body>
</html>
